name: API Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MySQL Container
        run: |
          docker run --name todo-mysql -e MYSQL_ROOT_PASSWORD=123456 -e MYSQL_DATABASE=todo_db -p 3306:3306 -d mysql:8.0
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if docker exec todo-mysql mysqladmin ping -h localhost -uroot -p123456 --silent; then
              echo "MySQL is up and running!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Start API server
        run: |
          # 在项目根目录启动，明确指定 app.main:app
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 9999 > uvicorn.log 2>&1 &
          sleep 5
          cat uvicorn.log  # 打印启动日志，便于排查
        env:
          BASE_URL: http://localhost:9999
          DB_URL: mysql+pymysql://root:123456@127.0.0.1:3306/todo_db
          ENV: test

      - name: Wait for server ready
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:9999/users > /dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run tests
        run: python -m pytest
        env:
          BASE_URL: http://localhost:9999
          ENV: test
          DB_URL: mysql+pymysql://root:123456@127.0.0.1:3306/todo_db

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -L \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --output allure-report --clean

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report