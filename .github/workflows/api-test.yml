name: API Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean database
        run: rm -f test_app.db

      - name: Start API server
        run: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for server ready
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:8000/users && echo "Server ready" && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run tests
        run: pytest
        env:
          BASE_URL: http://localhost:8000
          ENV: test

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -L \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --output allure-report --clean

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report