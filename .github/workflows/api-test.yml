name: API Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MySQL Container
        run: |
          docker run --name todo-mysql -e MYSQL_ROOT_PASSWORD=123456 -e MYSQL_DATABASE=todo_db -p 3306:3306 -d mysql:8.0
          echo "Waiting for MySQL to be ready..."
          # 给 MySQL 足够的时间启动
          for i in {1..30}; do
            if docker exec todo-mysql mysqladmin ping -h localhost -uroot -p123456 --silent; then
              echo "MySQL is up and running!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Initialize Database Tables
        env:
          # 确保脚本能连上数据库，并且能找到项目根目录的 config.py
          DB_URL: mysql+pymysql://root:123456@127.0.0.1:3306/todo_db
          ENV: test
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # 独立执行建表脚本，确保表 100% 被创建
          python init_db.py

      - name: Start API server
        env:
          BASE_URL: http://127.0.0.1:9999
          DB_URL: mysql+pymysql://root:123456@127.0.0.1:3306/todo_db
          ENV: test
          PYTHONPATH: ${{ github.workspace }}  # 极其关键！防止 ModuleNotFoundError
        run: |
          # 启动服务，并将错误日志输出，方便排查
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 9999 > uvicorn.log 2>&1 &
          
          # 等待 5 秒确保服务启动
          sleep 5
          
          # 打印服务的启动日志，这步能让你在 Actions 日志里清楚看到 uvicorn 有没有报错
          echo "--- Uvicorn Log ---"
          cat uvicorn.log

      - name: Run tests
        env:
          BASE_URL: http://127.0.0.1:9999
          ENV: test
          DB_URL: mysql+pymysql://root:123456@127.0.0.1:3306/todo_db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # 运行 pytest
          python -m pytest tests/ -v

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -L \
            https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --output allure-report --clean

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report